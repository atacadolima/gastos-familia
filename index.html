<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F5C4A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gastos">
<title>Gastos da Família</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=12">
</head>
<body>
<div id="app" aria-live="polite"></div>
<div id="sheet-fundo" class="sheet-fundo" hidden></div>
<div id="sheet" class="sheet" role="dialog" aria-modal="true" hidden></div>
<div id="toast" class="toast" role="status" hidden></div>
<script>
// Se algo falhar ao carregar, mostra o erro em vez de tela branca
window.addEventListener('unhandledrejection', function (e) {
  var r = e.reason || {}; window.dispatchEvent(new ErrorEvent('error', { message: 'Falha ao carregar: ' + (r.message || r) }));
});
window.addEventListener('error', function (e) {
  var app = document.getElementById('app');
  if (app && !app.children.length) {
    app.innerHTML = '<div style="padding:40px 24px;font-family:sans-serif"><h2>Não consegui abrir o app</h2><p style="color:#B3261E"></p><button style="min-height:44px;padding:0 20px;border-radius:10px;border:none;background:#1F5C4A;color:#fff;font-size:16px" onclick="location.reload()">Tentar de novo</button></div>';
    app.querySelector('p').textContent = (e.message || 'erro') + ' ' + (e.filename ? e.filename.split('/').pop() : '');
  }
});
</script>
<script src="vendor/supabase.min.js?v=2.50.0"></script>
<script src="app.js?v=12"></script>
</body>
</html>
